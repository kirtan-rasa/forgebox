name: ForgeBox release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    name: Resolve one dependency lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned winit source
        run: bash scripts/enable-native-wayland-dnd.sh
      - name: Resolve Cargo.lock
        run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-internal
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 2

  build-fedora:
    name: Build Fedora RPM
    needs: lockfile
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install container bootstrap tools
        run: dnf install -y git tar gzip curl findutils
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock-internal
          path: .
      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc gcc-c++ make pkgconf-pkg-config dbus-devel \
            libxkbcommon-devel wayland-devel libX11-devel libXrandr-devel \
            libXi-devel libXcursor-devel libXinerama-devel mesa-libGL-devel \
            freetype-devel fontconfig-devel rpm-build desktop-file-utils
      - name: Prepare native Wayland patch
        run: bash scripts/enable-native-wayland-dnd.sh
      - name: Run Rust tests
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package RPM
        run: |
          desktop-file-validate share/forgebox.desktop
          bash packaging/rpm/build-rpm.sh
          cp docs/FEDORA-RUNTIME-DEPENDENCIES.md dist/README-Fedora.txt
          rpm -qp --requires dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: forgebox-fedora-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows installer
    needs: lockfile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock-internal
          path: .
      - name: Prepare pinned winit source
        shell: pwsh
        run: ./scripts/prepare-winit-windows.ps1
      - name: Run Rust tests
        run: cargo test --locked
      - name: Build release executable
        run: cargo build --release --locked
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer and portable package
        shell: pwsh
        run: ./packaging/windows/prepare-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: forgebox-windows-x64
          path: |
            dist/ForgeBox-Setup-x64.exe
            dist/ForgeBox-portable-x64.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-fedora, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the tag matches Cargo.toml
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Release tag v${tag_version} does not match Cargo.toml version ${cargo_version}." >&2
            echo "Update Cargo.toml or create the matching tag before publishing." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: forgebox-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ForgeBox ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**
