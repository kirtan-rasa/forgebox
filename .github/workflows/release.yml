name: ForgeBox Linux builds

concurrency:
  group: forgebox-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Validate committed Rust lockfile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare native Wayland patch
        run: bash scripts/enable-native-wayland-dnd.sh
      - name: Validate committed Cargo.lock
        run: |
          test -s Cargo.lock
          git ls-files --error-unmatch Cargo.lock
          cargo metadata --locked --format-version 1 --no-deps
      - uses: actions/upload-artifact@v4
        with:
          name: internal-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
  test:
    name: Test Linux source
    needs: lockfile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: internal-cargo-lock
          path: .
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate shell scripts
        run: find scripts packaging -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config git \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libdbus-1-dev libfreetype6-dev libfontconfig1-dev \
            qpdf poppler-utils
      - name: Prepare native Wayland drag-and-drop backend
        run: bash scripts/enable-native-wayland-dnd.sh
      - name: Validate optional Fedora installer script
        run: bash -n scripts/install-rembg-fedora.sh
      - name: Run Rust tests
        run: cargo test --locked
      - name: Check Rust source
        run: cargo check --locked

  build-fedora:
    name: Build Fedora RPM
    needs: [lockfile, test]
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build tools
        run: |
          dnf install -y git tar gzip curl findutils \
            gcc gcc-c++ make pkgconf-pkg-config dbus-devel \
            libxkbcommon-devel wayland-devel libX11-devel libXrandr-devel \
            libXi-devel libXcursor-devel libXinerama-devel mesa-libGL-devel \
            freetype-devel fontconfig-devel rpm-build rpm-sign gnupg2 \
            desktop-file-utils
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: internal-cargo-lock
          path: .
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare native Wayland patch
        run: bash scripts/enable-native-wayland-dnd.sh
      - name: Build release binary
        run: cargo build --release --locked
      - name: Validate desktop entry and package RPM
        run: |
          desktop-file-validate share/forgebox.desktop
          bash packaging/rpm/build-rpm.sh
          rpm -qp --requires dist/*.rpm
          rpm -qpl dist/*.rpm | grep -F '/install-rembg-fedora.sh'
      - name: Sign RPM for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RPM_SIGNING_PRIVATE_KEY: ${{ secrets.RPM_SIGNING_PRIVATE_KEY }}
        run: bash scripts/sign-rpm.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: forgebox-fedora-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-deb-appimage-arch:
    name: Build DEB, AppImage and Arch package
    needs: [lockfile, test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: internal-cargo-lock
          path: .
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config git file patchelf desktop-file-utils \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libdbus-1-dev libfreetype6-dev libfontconfig1-dev libfuse2 \
            squashfs-tools zsync
      - name: Prepare native Wayland patch
        run: bash scripts/enable-native-wayland-dnd.sh
      - name: Build release binary
        run: cargo build --release --locked
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build DEB, AppImage and Pacman outputs
        run: |
          rm -rf dist/linux
          cargo packager --release
      - name: Normalize and validate package outputs
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find dist/linux -maxdepth 1 -type f -name '*.deb' -print -quit)"
          APPIMAGE="$(find dist/linux -maxdepth 1 -type f -iname '*.appimage' -print -quit)"
          test -n "$DEB"
          test -n "$APPIMAGE"
          test -n "$(find dist/linux -maxdepth 1 -type f -name 'PKGBUILD' -print -quit)"
          test -n "$(find dist/linux -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"

          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | grep 'usr/bin/forgebox' >/dev/null

          bash packaging/linux/prepare-pacman-pkgbuild.sh dist/linux/PKGBUILD

          chmod +x "$APPIMAGE"
          APPIMAGE_CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "$APPIMAGE_CHECK_DIR"' EXIT
          (cd "$APPIMAGE_CHECK_DIR" && "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract)
          test -x "$APPIMAGE_CHECK_DIR/squashfs-root/usr/bin/forgebox"
          test -f "$APPIMAGE_CHECK_DIR/squashfs-root/usr/share/applications/forgebox.desktop"
          test -f "$APPIMAGE_CHECK_DIR/squashfs-root/usr/share/icons/hicolor/256x256/apps/forgebox.png"
          rm -rf "$APPIMAGE_CHECK_DIR"
          trap - EXIT

          find dist/linux -maxdepth 1 -type f -printf '%P\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: forgebox-deb-appimage-arch-x86_64
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 14

  build-arch-pacman:
    name: Build native Arch Pacman package
    needs: build-deb-appimage-arch
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Arch packaging tools
        run: pacman -Sy --noconfirm --needed base-devel git shadow
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: forgebox-deb-appimage-arch-x86_64
          path: dist/linux
      - name: Build Pacman package and SRCINFO
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home builder
          WORKDIR="$GITHUB_WORKSPACE/dist/linux"
          chown -R builder:builder "$GITHUB_WORKSPACE/dist"
          su builder -c "cd '$WORKDIR' && makepkg --nodeps --noconfirm"
          su builder -c "cd '$WORKDIR' && makepkg --printsrcinfo > .SRCINFO"
          test -n "$(find dist/linux -maxdepth 1 -type f -name '*.pkg.tar.*' -print -quit)"
          test -s dist/linux/.SRCINFO
          pacman -Qip dist/linux/*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: forgebox-arch-pacman-x86_64
          path: |
            dist/linux/*.pkg.tar.zst
            dist/linux/.SRCINFO
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  publish-release:
    name: Publish Linux release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-fedora, build-deb-appimage-arch, build-arch-pacman]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the tag matches Cargo.toml
        shell: bash
        run: |
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Release tag v${tag_version} does not match Cargo.toml version ${cargo_version}." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: forgebox-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: ForgeBox ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**
