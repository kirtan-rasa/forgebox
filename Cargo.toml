[package]
name = "forgebox"
version = "0.2.0-beta.2"
edition = "2021"
description = "A privacy-first local file utility studio"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
csv = "1.3"
serde_json = "1.0"
qrcode = "0.14"

[profile.release]
# Avoid full LTO and a single codegen unit: much faster release builds on low-power CPUs.
lto = false
codegen-units = 16
strip = true
panic = "abort"

# Native Wayland external file drops for the current eframe/winit 0.30 stack.
[patch.crates-io]
winit = { path = "patches/winit" }
egui-winit = { path = "patches/egui-winit" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"


# Linux distribution packages: DEB, AppImage and Arch Pacman.
[package.metadata.packager]
product-name = "ForgeBox"
identifier = "com.kirtanrasa.forgebox"
category = "Utility"
formats = ["deb", "appimage", "pacman"]
binaries-dir = "target/release"
out-dir = "dist/linux"
icons = ["assets/forgebox.png"]
license-file = "LICENSE"

[[package.metadata.packager.binaries]]
path = "forgebox"
main = true

[package.metadata.packager.deb]
depends = [
  "libc6", "libgcc-s1", "libstdc++6", "libxkbcommon0",
  "libwayland-client0", "libx11-6", "libxrandr2", "libxi6",
  "libxcursor1", "libxinerama1", "libgl1", "libdbus-1-3",
  "libfreetype6", "libfontconfig1", "imagemagick", "poppler-utils",
  "ghostscript", "qpdf", "pdftk-java", "libreoffice",
  "tesseract-ocr", "tesseract-ocr-eng", "libimage-exiftool-perl",
  "xdg-utils"
]
package-name = "forgebox"
desktop-template = "share/forgebox.desktop"

[package.metadata.packager.pacman]
depends = [
  "glibc", "gcc-libs", "libxkbcommon", "wayland", "libx11",
  "libxrandr", "libxi", "libxcursor", "libxinerama", "mesa",
  "dbus", "freetype2", "fontconfig", "imagemagick", "poppler",
  "ghostscript", "qpdf", "libreoffice-fresh", "tesseract", "tesseract-data-eng",
  "perl-image-exiftool", "xdg-utils"
]

[package.metadata.packager.pacman.files]
"share/forgebox.desktop" = "usr/share/applications/forgebox.desktop"
"assets/forgebox.png" = "usr/share/icons/hicolor/256x256/apps/forgebox.png"
