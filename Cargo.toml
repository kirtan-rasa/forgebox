[package]
name = "forgebox"
version = "0.2.0-beta.1"
edition = "2021"
description = "A privacy-first local file utility studio"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
csv = "1.3"
serde_json = "1.0"
qrcode = "0.14"

[profile.release]
# Avoid full LTO and a single codegen unit: much faster release builds on low-power CPUs.
lto = false
codegen-units = 16
strip = true
panic = "abort"

# Native Wayland external file drops for the current eframe/winit 0.30 stack.
[patch.crates-io]
winit = { path = "patches/winit" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
